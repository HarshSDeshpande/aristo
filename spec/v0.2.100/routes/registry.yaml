# THE ROUTE REGISTRY (T0 "names once"): one row per route the conductor mounts. The source of every
# route name: the conductor's door table and route list, the dashboard's routes.json, the CLI's
# paths and the FDE plugin's routes are GENERATED from this file by scripts/generate-routes.sh.
# Seeded ONCE from conductor 85289414 by scripts/seed-registry-once.py (retired after T0).
#
# Columns (vyasa REVIEW-T0 §5, ruled 2026-10-16):
#   id          the route's stable name, family.noun.verb (assigned once, never renamed)
#   method, path  as mounted (axum template: `:param`, `*rest`)
#   plane       customer | admin | box | platform (the contract file the row joins)
#   family      routes.md's twelve: identity setup live mirrors verify picture findings books
#               campaigns intake tenants shell
#   at          repo | org_level | org_directory | org_root | admin | sign_in
#               (a DOOR row; a row without `at` is a mount with no door: no person, machine
#               or reads either)
#   person      {rung, checks}: rung = today's `requires` word VERBATIM (session member read
#               admin owner operator formalize); checks = the handler checks in order
#   machine     ONE capability or `none` (T2, CAPABILITY-MODEL §1, rewritten once from today's
#               arms): read verify steer campaign_author formalize operate stamp | none. A machine
#               passes when its reach covers the scope the path names AND its minted set holds
#               the capability; `none` = no machine passes. The credential's kind is never read.
#   reads       path | org | entity | repo
#   org_level   true on a row whose `_org` form answers (none today); absent = false
#   release2    true on a release-2 row the spec's planes do not describe; absent = false
#   retired     {status: 404 | 410, successor: <id>} (the successor absent = none)
#   callers     page | seat | ops | box | cli | ci (optional; T0 fills page, seat, cli)
